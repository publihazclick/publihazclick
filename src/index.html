<body>
  <!-- ═══════════ SPLASH DE ARRANQUE PARA MOVI (nativo Android) ═══════════
       Replica estatica (HTML/CSS/SVG puro, sin depender de Angular) de la pantalla
       "screen()==='splash'" de anda-gana.component.ts. Pinta al instante, en paralelo
       a que carga el bundle de Angular, para poder ocultar la splash nativa de Android
       (pantalla morada lisa sin logo) apenas hay algo real que mostrar, en vez de
       esperar a que Angular termine de arrancar. anda-gana.component.ts la quita del
       DOM en su ngOnInit una vez que el propio splash de Angular ya esta pintado. -->
  <div id="movi-boot-splash" style="display:none;position:fixed;inset:0;z-index:99999;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#7C3AED 0%,#4F46E5 50%,#2563EB 100%)">
    <div class="movi-boot-logo-wrap" style="display:flex;flex-direction:column;align-items:center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" style="width:210px;height:273px;filter:drop-shadow(0 8px 32px rgba(0,0,0,0.35))">
        <path d="M0-58C-32-58-54-36-54-8C-54 24 0 66 0 66C0 66 54 24 54-8C54-36 32-58 0-58Z" fill="#FFFFFF" transform="translate(100,95)"/>
        <circle cx="100" cy="81" r="20" fill="#6D28D9"/>
        <circle cx="100" cy="81" r="9" fill="#FFFFFF"/>
        <text x="100" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">MOVI</text>
        <text x="100" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.8)" text-anchor="middle">La aplicación de transporte</text>
        <text x="100" y="231" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="rgba(255,255,255,0.95)" text-anchor="middle">Más segura a nivel mundial</text>
      </svg>
    </div>
    <div style="display:flex;gap:10px;margin-top:48px">
      <div style="width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.8);animation:moviBootDot 1.4s ease-in-out 0.0s infinite"></div>
      <div style="width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.8);animation:moviBootDot 1.4s ease-in-out 0.2s infinite"></div>
      <div style="width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.8);animation:moviBootDot 1.4s ease-in-out 0.4s infinite"></div>
    </div>
  </div>
  <style>
    @keyframes moviBootDot { 0%,80%,100% { transform:scale(0.5); opacity:0.3 } 40% { transform:scale(1); opacity:1 } }
    @keyframes moviBootEntrance {
      0%   { opacity:0; transform: scale(0.75) translateY(50px); }
      65%  { opacity:1; transform: scale(1.06) translateY(-8px); }
      100% { opacity:1; transform: scale(1)    translateY(0px);  }
    }
    @keyframes moviBootFloat {
      0%,100% { transform: translateY(0px);   }
      50%     { transform: translateY(-18px); }
    }
    /* Misma animacion que .movi-logo-wrap en anda-gana.component.ts -- que esta pantalla
       "flote" desde el primer frame, para que no se sienta fija mientras carga Angular. */
    .movi-boot-logo-wrap {
      animation: moviBootEntrance 0.85s cubic-bezier(0.34,1.56,0.64,1) forwards,
                 moviBootFloat    2.8s  ease-in-out 0.85s infinite;
    }
  </style>
  <script>
    (function () {
      if (!location.pathname.startsWith('/anda-gana')) return;
      var el = document.getElementById('movi-boot-splash');
      if (el) el.style.display = 'flex';
      // Oculta la splash nativa de Android apenas hay algo real pintado (este overlay),
      // en vez de esperar a que Angular cargue y llame SplashScreen.hide() por su cuenta.
      function hideNativeSplash() {
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
            window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 0 });
            return true;
          }
        } catch (e) {}
        return false;
      }
      if (!hideNativeSplash()) {
        var tries = 0;
        var iv = setInterval(function () {
          tries++;
          if (hideNativeSplash() || tries > 100) clearInterval(iv);
        }, 20);
      }
    })();
  </script>
