  <!-- Fondo inmediato para Movi (evita pantalla blanca/negra antes del splash).
       "/movi" es alias de "/anda-gana" (link de invitación con marca real) -- debe
       activar el mismo fondo/splash de Movi, si no el invitado ve un flash en blanco. -->
  <script>if(location.pathname.startsWith('/anda-gana')||location.pathname==='/movi'||location.pathname.startsWith('/movi/')){document.documentElement.classList.add('movi-app');document.documentElement.style.cssText='background:#245BDB;margin:0'}</script>
  <style>
    /* Pedido explicito del usuario 2026-08-12: que el splash NUNCA desaparezca/reaparezca --
       antes vivía DENTRO de <app-root>, y Angular lo reemplazaba por su propia versión al
       arrancar (mismo diseño, pero al ser un elemento de DOM nuevo podía notarse un parpadeo en
       dispositivos lentos). Ahora vive AFUERA, como hermano de <app-root>, tapando todo con
       z-index más alto -- Angular arranca y pinta su propio splash por debajo sin que se note,
       y este overlay se queda exactamente igual (mismo elemento, animación nunca se reinicia)
       hasta que la propia app avisa por JS que ya tiene una pantalla real que mostrar (ver
       window.__moviInterfaceReady, seteado en anda-gana.component.ts). Un solo elemento, una
       sola animación continua, un solo momento de ocultarse -- cero parpadeos posibles. */
    html.movi-app .movi-static-splash { display: flex; }
    .movi-static-splash {
      /* top/right/bottom/left explicitos en vez de "inset:0" -- el WebView de algunos telefonos
         (ej. Huawei/Honor sin Google Play Services, WebView desactualizado) no soporta el
         shorthand "inset" y el div quedaba colapsado/invisible sin que se notara ningun error. */
      display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1000;
      width: 100%; height: 100%;
      flex-direction: column; align-items: center; justify-content: center;
      background: #245BDB;
      background: linear-gradient(160deg, #245BDB 0%, #1D3FAE 50%, #2563EB 100%);
      transition: opacity 0.25s ease-out;
    }
    .movi-static-splash.movi-hide { opacity: 0; pointer-events: none; }
    /* Pedido explicito del usuario 2026-08-11: que el logo flote apenas aparece, para que la
       espera se sienta "viva" y no como una app congelada. MISMOS valores que .movi-logo-wrap/
       @keyframes moviFloat en anda-gana.component.ts (2.8s, -18px) a propósito -- es la misma
       animación en loop continuo, sin punto de inicio marcado, así que cuando Angular toma el
       control del mismo elemento no se nota ningún salto ni reinicio. */
    .movi-static-splash svg { animation: moviFloat 2.8s ease-in-out infinite; }
    @keyframes moviFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }
  </style>

<body>
  <script>
    (function () {
      if (!location.pathname.startsWith('/anda-gana') && location.pathname !== '/movi' && !location.pathname.startsWith('/movi/')) return;
      // No ocultar la splash nativa apenas el puente de Capacitor exista -- eso pasa demasiado
      // rapido (antes de que la pagina real haya pintado algo), dejando ver un hueco negro/blanco.
      // Se espera un tiempo fijo para darle margen de sobra al navegador. El techo de 5s de
      // launchAutoHide en capacitor.config.ts sigue de respaldo si esto tardara mas.
      function hideNativeSplash() {
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
            window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 0 });
            return true;
          }
        } catch (e) {}
        return false;
      }
      setTimeout(function () {
        if (!hideNativeSplash()) {
          var tries = 0;
          var iv = setInterval(function () {
            tries++;
            if (hideNativeSplash() || tries > 100) clearInterval(iv);
          }, 20);
        }
      }, 2000);

      // Pedido explicito 2026-08-12: ocultar el splash estatico de abajo UNA sola vez, exactamente
      // cuando anda-gana.component.ts marca window.__moviInterfaceReady = true (screen() dejó de
      // ser 'splash'/'loading'). Red de seguridad propia de 20s por si esa señal nunca llega, para
      // que este overlay tampoco pueda quedar pegado para siempre.
      var _splashEl = null;
      var _splashTries = 0;
      var _splashIv = setInterval(function () {
        _splashTries++;
        if (!_splashEl) _splashEl = document.querySelector('.movi-static-splash');
        if (window.__moviInterfaceReady || _splashTries > 1000) {
          if (_splashEl) _splashEl.classList.add('movi-hide');
          clearInterval(_splashIv);
        }
      }, 100);
    })();
  </script>
  <!--
    Logo estatico de Movi mientras Angular termina de cargar (pedido explicito del usuario
    2026-08-11, tras 2 intentos fallidos a nivel nativo Android -- confirmado con 3 videos reales
    del arranque que ni el fondo de la ventana ni el fondo del WebView eran la capa que de verdad
    se veia en pantalla durante la espera).

    ACTUALIZACION 2026-08-12: se movió de DENTRO de <app-root> a ser hermano de <app-root> (ver
    estilo .movi-static-splash arriba) -- vivir dentro de app-root significaba que Angular lo
    reemplazaba por su propia versión al bootstrapear (mismo diseño, pero al ser un DOM nuevo el
    usuario reportó parpadeo en dispositivos lentos: splash → azul plano → splash otra vez). Ahora
    es un único elemento persistente que tapa todo con z-index más alto, nunca se destruye ni se
    reinicia, y solo se oculta una vez cuando la interfaz real ya está lista.
  -->
  <div class="movi-static-splash">
    <div style="position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,0.05)"></div>
